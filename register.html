
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-6 rounded-lg shadow-lg w-80">

        <h1 class="text-2xl font-bold text-center mb-6">
            Register
        </h1>

        <form>
            <label for="username" class="block mb-2 font-medium">
                Username
            </label>
            <input type="text" id="username"
                class="w-full p-2 mb-4 border border-gray-300 rounded"
                required>

            <label for="email" class="block mb-2 font-medium">
                Email
            </label>
            <input type="email" id="email"
                class="w-full p-2 mb-4 border border-gray-300 rounded"
                required>

            <label for="password" class="block mb-2 font-medium">
                Password
            </label>
            <input type="password" id="password"
                class="w-full p-2 mb-4 border border-gray-300 rounded"
                required>

            <label for="confirmPassword" class="block mb-2 font-medium">
                Confirm Password
            </label>
            <input type="password" id="confirmPassword"
                class="w-full p-2 mb-4 border border-gray-300 rounded"
                required>

            <button type="submit"
                class="w-full p-3 bg-blue-500 text-white rounded hover:bg-blue-600">
                Register
            </button>

            <a href="login.html"
                class="block text-center w-full p-3 mt-4 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">
                Back to Login
            </a>
        </form>

    </div>

</body>
</html>
